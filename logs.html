<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonkeyTester - Console Logs</title>
<style>
{{CSS}}
</style>
</head>
<body>
<div class="container">
    <header class="site-header">
        <h1 class="site-brand"><a href="/">MonkeyTester</a></h1>
        <nav class="site-nav" id="site-nav" aria-label="Primary navigation"></nav>
    </header>
    <div id="content"></div>
</div>
<script>
{{JS}}
function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

async function loadLogs() {
    const run = getQueryParam('run');
    if (!run) {
        document.getElementById('content').innerHTML = '<div class="loading">No run specified</div>';
        return;
    }

    document.getElementById('content').innerHTML = '<div class="loading">Loading console logs...</div>';

    // Get run metadata for the header info
    let items = [];
    try {
        const metadata = await fetchJSON('/api/metadata/' + encodeURIComponent(run));
        if (metadata) {
            const meta = metadata;
            if (meta.timestamp) items.push('Start: ' + escapeHtml(meta.timestamp));
            if (meta.end_time) items.push('End: ' + escapeHtml(meta.end_time));
            if (meta.script) items.push('Script: ' + escapeHtml(meta.script));
            if (meta.apk) {
                const apk = meta.apk;
                let apkInfo = 'APK: ' + (apk.build_type || '');
                if (apk.version && apk.version !== 'unspecified') apkInfo += ' v' + escapeHtml(apk.version);
                if (apk.build_time) apkInfo += ' (' + escapeHtml(apk.build_time) + ')';
                items.push(apkInfo);
            }
            if (meta.device) {
                items.push('Device: ' + escapeHtml(meta.device.model || meta.device.serial || ''));
            } else if (meta.emulator) {
                items.push('Emulator: ' + escapeHtml(meta.emulator.image || ''));
            }
            const options = meta.options || {};
            if (options.debug) items.push('Debug');
            if (options.skip_backend) items.push('No backend');
        }
    } catch(e) {
        console.warn('Failed to load metadata:', e);
    }

    const dlBtn = '<a class="btn-secondary" style="margin-left:auto;text-decoration:none;" href="/api/logs/' + encodeURIComponent(run) + '" download>Download .log</a>';
    const metaHtml = '<div class="run-meta-bar">' + items.map(i => '<span class="run-meta-item">' + i + '</span>').join('') + dlBtn + '</div>';

    // Load console log
    try {
        const text = await fetchText('/api/logs/' + encodeURIComponent(run));
        const html = metaHtml +
            '<div class="logs-full">' +
            '<pre class="logs-content" id="log-output">' + escapeHtml(text) + '</pre>' +
            '</div>';
        document.getElementById('content').innerHTML = html;
        setInterval(() => refreshLogs(run), 3000);
    } catch(e) {
        document.getElementById('content').innerHTML = '<div class="loading">Failed to load console logs</div>';
    }
}

async function refreshLogs(run) {
    const pre = document.getElementById('log-output');
    if (!pre) return;
    try {
        const text = await fetchText('/api/logs/' + encodeURIComponent(run));
        // Only touch the DOM when the log actually changed. This preserves any
        // in-progress selection / copy-paste and avoids needless reflow.
        const prev = pre.textContent;
        if (prev === text) return;
        const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
        if (text.startsWith(prev)) {
            // Append-only log: add just the new suffix (cheaper than a full
            // rewrite and keeps existing layout/selection intact).
            pre.textContent += text.slice(prev.length);
        } else {
            // Log was rewritten/rotated/truncated — fall back to full replace.
            pre.textContent = text;
        }
        if (atBottom) pre.scrollTop = pre.scrollHeight;
    } catch(e) {}
}

loadLogs();
</script>
</body>
</html>
