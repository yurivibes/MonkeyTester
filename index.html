<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonkeyTester</title>
<style>
{{CSS}}
/* Dashboard styles */
.container { max-width: none; }
.dashboard-section { margin-bottom: 30px; }
.dashboard-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.dashboard-title { font-size: 1.1rem; font-weight: 600; }
.charts-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.chart-card { background: var(--surface); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
.chart-card h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.chart-container { position: relative; height: 200px; }
.chart-container canvas { width: 100%; height: 100%; }
.legend { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
/* Delete-runs selection */
.run-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.run-left .run-info, .run-left .run-sub { min-width: 0; }
.run-left .run-branch { overflow: hidden; text-overflow: ellipsis; }
.run-check { display: flex; align-items: center; cursor: pointer; flex-shrink: 0; }
.run-checkbox { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
.run-open { color: inherit; text-decoration: none; }
.run-open:hover { color: var(--accent); }
.run-item.selected { border-color: var(--accent); background: var(--accent-dim); }
/* Run status: just the pass/fail badge (no ratio text or bar) */
.run-badge { display: flex; align-items: center; }
.runs-toolbar { display: flex; justify-content: flex-end; margin: 4px 0 10px; }
.delete-btn { background: var(--fail); color: #fff; border: none; padding: 4px 12px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: 600; }
.delete-btn:hover { opacity: 0.9; }
.run-project { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.run-project.unassigned { font-style: italic; }
/* Commit under test, next to the run #: short id + subject line, full message on hover */
.run-head { display: flex; align-items: baseline; gap: 10px; min-width: 0; padding-right: 12px; }
.run-head .run-id { flex-shrink: 0; }
.run-commit { display: flex; gap: 6px; font-size: 0.8rem; color: var(--text); min-width: 0; }
.run-commit-sha { font-family: var(--mono); color: var(--text-muted); flex-shrink: 0; }
.run-commit-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
</style>
</head>
<body>
<div class="container">
    <header class="site-header">
        <h1 class="site-brand"><a href="/">MonkeyTester</a></h1>
        <nav class="site-nav" id="site-nav" aria-label="Primary navigation"></nav>
        <div class="header-actions">
            <select id="project-select" aria-label="Project" onchange="handleProjectChange(this.value)" style="background:var(--surface);border:1px solid #444;color:var(--text);padding:4px 8px;border-radius:4px;font-size:0.8rem;max-width:260px;">
                <option value="">All projects</option>
            </select>
            <select id="dashboard-range-select" onchange="handleDashboardRangeChange(this.value)" style="background:var(--surface);border:1px solid #444;color:var(--text);padding:4px 8px;border-radius:4px;font-size:0.8rem;">
                <option value="6m">6 months</option>
                <option value="3m">3 months</option>
                <option value="1m" selected>1 month</option>
                <option value="1w">Last week</option>
            </select>
            <select id="sort-select" onchange="handleSortChange(this.value)" style="background:var(--surface);border:1px solid #444;color:var(--text);padding:4px 8px;border-radius:4px;font-size:0.8rem;">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="name_asc">Name A-Z</option>
                <option value="name_desc">Name Z-A</option>
            </select>
        </div>
    </header>
    <div id="dashboard-content" class="dashboard-section"></div>
    <div class="runs-toolbar">
        <button id="delete-selected-btn" class="delete-btn" style="display:none" onclick="deleteSelectedRuns()">Delete</button>
    </div>
    <div id="content"></div>
</div>
<script>
{{JS}}
let currentDashboardRange = '1m';
let dashboardChartData = null;
// Project filter: '' = all, '_unassigned' = runs with no repo, else owner/repo.
// Kept in the URL (?project=) so a filtered dashboard can be bookmarked.
const UNASSIGNED = '_unassigned';
let currentProject = new URLSearchParams(location.search).get('project') || '';

function projectQuery() {
    return currentProject ? '&project=' + encodeURIComponent(currentProject) : '';
}

async function loadProjects() {
    const sel = document.getElementById('project-select');
    try {
        const data = await fetchJSON('/api/projects');
        const projects = data.projects || [];
        if (currentProject && currentProject !== UNASSIGNED && !projects.includes(currentProject)) projects.push(currentProject);
        let html = '<option value="">All projects</option>' +
            projects.map(p => '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + '</option>').join('');
        if (data.unassigned || currentProject === UNASSIGNED) html += '<option value="' + UNASSIGNED + '">Unassigned</option>';
        sel.innerHTML = html;
        sel.value = currentProject;
    } catch (e) { /* the filter stays at All projects */ }
}

function handleProjectChange(value) {
    currentProject = value;
    const url = new URL(location.href);
    if (value) url.searchParams.set('project', value); else url.searchParams.delete('project');
    history.replaceState(null, '', url);
    selectedRuns.clear();
    lastClickedIndex = null;
    loadDashboard();
    showRuns();
}

// The canvas is drawn at a fixed pixel size, so redraw it when the available
// width changes (window resize or sidebar collapse).
new ResizeObserver(() => {
    if (dashboardChartData) renderChart('all-runs-canvas', dashboardChartData);
}).observe(document.getElementById('dashboard-content'));

async function loadDashboard() {
    const dashboardDiv = document.getElementById('dashboard-content');
    dashboardDiv.innerHTML = '<div class="loading">Loading dashboard...</div>';
    
    try {
        const dashboardData = await fetchJSON('/api/dashboard?range=' + currentDashboardRange + projectQuery());
        renderDashboard(dashboardData);
    } catch (e) {
        dashboardDiv.innerHTML = '<div class="loading">Error loading dashboard: ' + e.message + '</div>';
    }
}

function handleDashboardRangeChange(range) {
    currentDashboardRange = range;
    loadDashboard();
}

function renderDashboard(data) {
    const dashboardDiv = document.getElementById('dashboard-content');
    let html = '<div class="dashboard-header">';
    html += '<span class="dashboard-title">Test Usage Dashboard</span>';
    html += '</div>';
    html += '<div class="charts-grid">';
    
    // All Runs chart
    html += '<div class="chart-card">';
    html += '<h3>All Runs</h3>';
    html += '<div class="chart-container"><canvas id="all-runs-canvas"></canvas></div>';
    html += '<div class="legend">';
    html += '<div class="legend-item"><span class="legend-dot" style="background:var(--pass);"></span>Passed</div>';
    html += '<div class="legend-item"><span class="legend-dot" style="background:var(--fail);"></span>Failed</div>';
    html += '<div class="legend-item"><span class="legend-dot" style="background:var(--running);"></span>Running</div>';
    html += '</div>';
    html += '</div>';
    
    html += '</div>';
    dashboardChartData = data['all_runs'] || { labels: [], passed: [], failed: [], running: [] };
    dashboardDiv.innerHTML = html;

    // Render charts
    setTimeout(() => {
        renderChart('all-runs-canvas', dashboardChartData);
    }, 100);
}

// Chart colours come from the theme variables, so the canvas follows
// dark/light mode like the rest of the page.
function themeColor(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderChart(canvasId, chartData) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !chartData.labels.length) {
        if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            ctx.fillStyle = themeColor('--text-muted');
            ctx.font = '14px "JetBrains Mono", ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.fillText('No data available', canvas.width / 2, canvas.height / 2);
        }
        return;
    }
    
    const ctx = canvas.getContext('2d');
    const container = canvas.parentElement;
    canvas.width = container.offsetWidth * 2; // Retina
    canvas.height = container.offsetHeight * 2;
    canvas.style.width = container.offsetWidth + 'px';
    canvas.style.height = container.offsetHeight + 'px';
    ctx.scale(2, 2);
    
    const width = container.offsetWidth;
    const height = container.offsetHeight;
    const padding = { top: 20, right: 20, bottom: 40, left: 40 };
    const chartWidth = width - padding.left - padding.right;
    const chartHeight = height - padding.top - padding.bottom;
    
    // Clear
    ctx.clearRect(0, 0, width, height);
    
    // Find max value for scaling
    const allValues = [...chartData.passed, ...chartData.failed, ...chartData.running];
    const maxValue = Math.max(...allValues, 1);
    
    // Draw grid lines
    ctx.strokeStyle = themeColor('--border');
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
        const y = padding.top + (chartHeight / 4) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        
        // Y-axis labels
        const value = Math.round(maxValue * (1 - i / 4));
        ctx.fillStyle = themeColor('--text-muted');
        ctx.font = '10px "JetBrains Mono", ui-monospace, monospace';
        ctx.textAlign = 'right';
        ctx.fillText(value, padding.left - 8, y + 4);
    }
    
    // Draw bars
    const barGroupWidth = chartWidth / chartData.labels.length;
    const barWidth = Math.min(barGroupWidth * 0.6, 20);
    
    const colors = {
        passed: themeColor('--pass'),
        failed: themeColor('--fail'),
        running: themeColor('--running')
    };
    
    for (let i = 0; i < chartData.labels.length; i++) {
        const x = padding.left + barGroupWidth * i + barGroupWidth / 2;
        
        // Draw stacked bars for each metric
        let yOffset = padding.top + chartHeight;
        
        // Failed bar
        const failedHeight = (chartData.failed[i] / maxValue) * chartHeight;
        if (chartData.failed[i] > 0) {
            ctx.fillStyle = colors.failed;
            ctx.fillRect(x - barWidth / 2, yOffset - failedHeight, barWidth, failedHeight);
        }
        yOffset -= failedHeight;
        
        // Running bar
        const runningHeight = (chartData.running[i] / maxValue) * chartHeight;
        if (chartData.running[i] > 0) {
            ctx.fillStyle = colors.running;
            ctx.fillRect(x - barWidth / 2, yOffset - runningHeight, barWidth, runningHeight);
        }
        yOffset -= runningHeight;
        
        // Passed bar
        const passedHeight = (chartData.passed[i] / maxValue) * chartHeight;
        if (chartData.passed[i] > 0) {
            ctx.fillStyle = colors.passed;
            ctx.fillRect(x - barWidth / 2, yOffset - passedHeight, barWidth, passedHeight);
        }
        
        // X-axis label — thin out when there are many buckets
        const maxLabels = Math.floor(chartWidth / 48);
        const step = Math.max(1, Math.ceil(chartData.labels.length / maxLabels));
        if (i % step === 0 || i === chartData.labels.length - 1) {
            ctx.fillStyle = themeColor('--text-muted');
            ctx.font = '10px "JetBrains Mono", ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.fillText(chartData.labels[i], x, height - padding.bottom + 16);
        }
    }
}

// ── Delete-runs selection state ──
let selectedRuns = new Set();   // run names currently checked
let lastClickedIndex = null;    // for shift-click range selection
let runOrder = [];              // run names in current display order

// Runs live on disk as run_<n>; the dashboard labels them #<n>. Only display:
// selection, links and API payloads keep the raw run_<n> name.
// The run row's commit line: short id + the message's subject line, the
// whole message as the tooltip. "" when the run recorded no commit.
function runCommitHtml(run) {
    const sha = run.commit || '';
    const message = run.commit_message || '';
    if (!sha && !message) return '';
    const subject = message.split('\n')[0];
    const tip = escapeHtml(message || sha).replace(/"/g, '&quot;');
    return '<span class="run-commit" title="' + tip + '">' +
        (sha ? '<span class="run-commit-sha">' + escapeHtml(sha.slice(0, 7)) + '</span>' : '') +
        (subject ? '<span class="run-commit-msg">' + escapeHtml(subject) + '</span>' : '') +
        '</span>';
}

function runDisplayLabel(name) {
    return String(name).replace(/^run_/, '#');
}

// test.html takes the bare run number: run_12 -> test.html?run=12.
function runPageUrl(name) {
    return 'test.html?run=' + encodeURIComponent(String(name).replace(/^run_(?=\d+$)/, ''));
}

async function showRuns() {
    document.getElementById('content').innerHTML = '<div class="loading">Loading results...</div>';
    const runs = await fetchJSON('/api/runs?sort=' + encodeURIComponent(currentSort) + projectQuery());
    if (!runs.length) {
        document.getElementById('content').innerHTML = '<div class="loading">' +
            (currentProject ? 'No runs for this project' : 'No test results found') + '</div>';
        updateDeleteButton();
        return;
    }
    runOrder = runs.map(r => r.name || r);
    let html = '<div class="run-list">';
    for (let i = 0; i < runs.length; i++) {
        const run = runs[i];
        const name = run.name || run;
        const date = run.date || '';
        const branch = run.branch || '';
        const repo = run.repo || '';
        const status = run.status || 'Unknown';
        const isRunning = run.is_running === true;
        const checked = selectedRuns.has(name) ? ' checked' : '';
        const selected = selectedRuns.has(name) ? ' selected' : '';
        html += '<div class="run-item' + (isRunning ? ' running' : '') + selected + '" data-index="' + i + '" data-name="' + escapeHtml(name) + '" onclick="onRunRowClick(event, ' + i + ')">' +
            '<span class="run-left">' +
                '<label class="run-check" onclick="event.stopPropagation()">' +
                    '<input type="checkbox" class="run-checkbox"' + checked + ' onclick="onRunCheckClick(event, ' + i + ')">' +
                '</label>' +
                '<span class="run-info">' +
                    '<span class="run-head">' +
                        '<a class="run-id run-open" href="' + runPageUrl(name) + '" onclick="event.stopPropagation()">' + escapeHtml(runDisplayLabel(name)) + '</a>' +
                        runCommitHtml(run) +
                    '</span>' +
                    '<span class="run-sub">' +
                        (date ? '<span class="run-date">' + escapeHtml(date) + '</span>' : '') +
                        (repo ? '<span class="run-project" title="Project">' + escapeHtml(repo) + '</span>'
                              : '<span class="run-project unassigned" title="No project recorded">Unassigned</span>') +
                        (branch ? '<span class="run-branch">' + escapeHtml(branch) + '</span>' : '') +
                    '</span>' +
                '</span>' +
            '</span>' +
            '<span class="run-badge">' +
                '<span class="badge ' + status.toLowerCase() + '">' + escapeHtml(status) + '</span>' +
            '</span>' +
            '</div>';
    }
    html += '</div>';
    document.getElementById('content').innerHTML = html;
    updateDeleteButton();
}

// Clicking a row (anywhere but the checkbox) opens the run's test page.
// Ctrl/Cmd-click or middle-click opens it in a new tab.
function onRunRowClick(event, index) {
    if (event.target.closest('.run-check')) return; // checkbox handles selection
    const name = runOrder[index];
    if (!name) return;
    const url = runPageUrl(name);
    if (event.ctrlKey || event.metaKey) window.open(url, '_blank');
    else window.location.href = url;
}

// Selection for Delete is checkbox-only.
// Shift-click a checkbox to select the range from the last clicked checkbox.
function onRunCheckClick(event, index) {
    const name = runOrder[index];
    if (event.shiftKey && lastClickedIndex !== null) {
        const [lo, hi] = [Math.min(lastClickedIndex, index), Math.max(lastClickedIndex, index)];
        for (let i = lo; i <= hi; i++) {
            if (runOrder[i]) selectedRuns.add(runOrder[i]);
        }
    } else if (event.target.checked) {
        selectedRuns.add(name);
    } else {
        selectedRuns.delete(name);
    }
    lastClickedIndex = index;
    refreshRunSelectionUI();
}

// Re-apply checked/selected state to the DOM without a full re-render.
function refreshRunSelectionUI() {
    document.querySelectorAll('.run-item').forEach(el => {
        const name = el.dataset.name;
        const on = selectedRuns.has(name);
        el.classList.toggle('selected', on);
        const cb = el.querySelector('.run-checkbox');
        if (cb) cb.checked = on;
    });
    updateDeleteButton();
}

function updateDeleteButton() {
    const btn = document.getElementById('delete-selected-btn');
    if (btn) btn.style.display = selectedRuns.size > 0 ? 'inline-block' : 'none';
}

async function deleteSelectedRuns() {
    if (selectedRuns.size === 0) return;
    const names = Array.from(selectedRuns);
    const label = names.length === 1 ? runDisplayLabel(names[0]) : names.length + ' runs';
    if (!confirm('Delete ' + label + '? This cannot be undone.')) return;
    try {
        const res = await fetch('/api/runs/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ runs: names }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Delete failed');
        if (data.skipped && data.skipped.length) {
            const detail = data.skipped.map(s => runDisplayLabel(s.name) + ' (' + s.reason + ')').join(', ');
            alert('Some runs were not deleted:\n' + detail);
        }
        selectedRuns.clear();
        lastClickedIndex = null;
        showRuns();
    } catch (e) {
        alert('Delete failed: ' + e.message);
    }
}

// Delete key deletes the selected runs (only when not typing in a field).
document.addEventListener('keydown', function (e) {
    if (e.key !== 'Delete') return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (selectedRuns.size > 0) {
        e.preventDefault();
        deleteSelectedRuns();
    }
});

function handleSortChange(value) {
    currentSort = value;
    showRuns();
}

loadProjects();
loadDashboard();
showRuns();
</script>
</body>
</html>
