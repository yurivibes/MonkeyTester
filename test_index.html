<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localhost Capture Card Stream</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #111; color: #fff; }
        video { background: #000; border: 2px solid #333; max-width: 90%; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Localhost Capture Card Feed</h1>
    <video id="videoPlayer" autoplay playsinline muted></video>
    <br>
    <button id="startButton" onclick="startStream()">Start Stream</button>

    <script>
        async function startStream() {
            document.getElementById('startButton').disabled = true;
            // Use the MJPEG stream proxied through app.py (port 8089)
            document.getElementById('videoPlayer').src = '/stream';
        }
    </script>
</body>
</html>
