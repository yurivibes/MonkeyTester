<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Configuration — MonkeyTester</title>
<style>
{{CSS}}

.config-device-list { display: flex; flex-direction: column; gap: 12px; }
.config-device { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.config-device-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.config-device-path { font-family: monospace; font-size: 0.8rem; color: var(--text-muted); background: var(--card); padding: 4px 8px; border-radius: 4px; }
.config-device-name { font-weight: 600; font-size: 0.95rem; }
.config-device-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.config-device-form input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
.config-device-form input:focus { outline: none; border-color: var(--accent); }
.config-device-form input.name-input { flex: 1; min-width: 180px; }
.config-device-form button { white-space: nowrap; }
.config-save-status { font-size: 0.75rem; margin-top: 6px; min-height: 16px; }
.config-save-status.saved { color: var(--pass); }
.config-save-status.error { color: var(--fail); }
.config-info { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
.config-save-all { margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }
.config-save-all button { padding: 8px 16px; background: var(--acid); color: var(--on-acid); border: 2px solid var(--acid); }
.config-save-all button[disabled] { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
.config-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
</style>
</head>
<body>
<div class="container">
    <header class="site-header">
        <h1 class="site-brand"><a href="/">MonkeyTester</a></h1>
        <nav class="site-nav" id="site-nav" aria-label="Primary navigation"></nav>
        <div class="header-actions">
            <button class="btn-secondary" onclick="refreshDevices()">Refresh Devices</button>
        </div>
    </header>

    <h2 class="page-title">Device Configuration</h2>
    <div class="config-info">
        Set friendly names for the devices connected to the Mobile Controller.
    </div>

    <div class="config-save-all">
        <button class="btn-secondary" id="saveAllBtn" onclick="saveAllDevices()">Save All Changes</button>
        <span class="config-save-status" id="global-status"></span>
    </div>

    <div class="config-device-list" id="device-list">
        <div class="loading">Loading devices...</div>
    </div>
</div>
<script>
{{JS}}

const configUrl = '/api/config/devices';

// The saved device-name map, kept current on every render.
let savedNames = null;

function saveAllDirty() {
    if (!savedNames) return true;
    let dirty = false;
    document.querySelectorAll('.config-device').forEach(el => {
        const input = el.querySelector('.name-input');
        if (!input) return;
        if (input.value.trim() !== (savedNames[el.dataset.id] || '')) dirty = true;
    });
    return dirty;
}

function updateSaveAllBtn() {
    const btn = document.getElementById('saveAllBtn');
    if (btn) btn.disabled = !saveAllDirty();
}

function refreshDevices() {
    renderDevices();
}

async function renderDevices() {
    const listEl = document.getElementById('device-list');
    listEl.innerHTML = '<div class="loading">Loading devices...</div>';

    const [devices, names] = await Promise.all([
        fetchJSON('/devices').catch(() => []),
        fetchJSON(configUrl).catch(() => ({}))
    ]);
    savedNames = names;

    if (!devices.length) {
        listEl.innerHTML = '<div class="loading">No devices found. Check that the Mobile Controller is running and the devices are connected to it.</div>';
        updateSaveAllBtn();
        return;
    }

    let html = '';
    for (const device of devices) {
        const id = escapeHtml(device.id);
        html += '<div class="config-device" data-id="' + id + '">';
        html += '<div class="config-device-header">';
        html += '<span class="config-device-path">' + id + '</span>';
        html += '<span class="config-device-name">' + escapeHtml(device.friendly_name) + '</span>';
        html += '<span style="font-size:0.75rem;color:var(--text-muted);">' + escapeHtml(device.platform) + '</span>';
        html += '</div>';
        html += '<div class="config-device-form">';
        html += '<div style="flex:1;min-width:180px;"><div class="config-label">Friendly Name</div><input type="text" class="name-input" placeholder="Device name..." value="' + escapeHtml(names[device.id] || '') + '" /></div>';
        html += '</div>';
        html += '</div>';
    }
    listEl.innerHTML = html;
    updateSaveAllBtn();
}

async function saveAllDevices() {
    const statusEl = document.getElementById('global-status');
    statusEl.className = 'config-save-status';
    statusEl.textContent = 'Saving...';

    // Keep names of devices that aren't connected right now.
    const names = await fetchJSON(configUrl).catch(() => ({}));
    document.querySelectorAll('.config-device').forEach(el => {
        const name = el.querySelector('.name-input').value.trim();
        if (name) names[el.dataset.id] = name;
        else delete names[el.dataset.id];
    });

    let ok = false;
    try {
        const res = await fetch(configUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(names)
        });
        ok = res.ok;
    } catch (e) {
        ok = false;
    }

    statusEl.className = 'config-save-status ' + (ok ? 'saved' : 'error');
    statusEl.textContent = ok ? 'Saved' : 'Failed to save';
    if (ok) await renderDevices();
    setTimeout(() => { statusEl.textContent = ''; }, 3000);
}

document.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter' && e.target.classList?.contains('name-input')) {
        const btn = document.getElementById('saveAllBtn');
        if (btn && btn.disabled) return; // nothing differs from the saved state
        await saveAllDevices();
    }
});

document.addEventListener('input', updateSaveAllBtn);
document.addEventListener('change', updateSaveAllBtn);

renderDevices();
</script>
</body>
</html>
