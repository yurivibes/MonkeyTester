<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; color: #e0e0e0; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
#url-bar { display: flex; gap: 8px; padding: 12px 16px; background: #2a2a2a; border-bottom: 1px solid #444; }
#url-bar input { flex: 1; padding: 8px 12px; background: #1a1a1a; border: 1px solid #555; color: #e0e0e0; border-radius: 4px; font-size: 14px; }
#url-bar button { padding: 8px 20px; background: #4a9eff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
#url-bar button:hover { background: #3a8eef; }
#file-input { display: none; }
#local-btn { padding: 8px 16px; background: #3a7a3a; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
#local-btn:hover { background: #2a6a2a; }
#player-wrap { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
#player-wrap video { max-width: 100%; max-height: 100%; }
#status { text-align: center; padding: 40px; color: #888; font-size: 16px; }
#error { text-align: center; padding: 20px; color: #ff6b6b; }
</style>
</head>
<body>
<div id="url-bar">
    <input id="url-input" type="text" placeholder="Enter video URL or /convert-video/run_X/log.mp4">
    <button onclick="loadUrl()">Play</button>
    <button id="local-btn" onclick="document.getElementById('file-input').click()">Open File…</button>
</div>
<input id="file-input" type="file" accept="video/*" onchange="loadFile(event)">
<div id="status">Enter a video URL or click "Open File…" to play locally</div>
<div id="player-wrap" style="display:none">
    <video id="video" controls autoplay style="max-height:calc(100vh - 80px)"></video>
</div>
<div id="error"></div>
<script>
const video = document.getElementById('video');
const params = new URLSearchParams(window.location.search);
const file = params.get('file');
if (file) {
    document.getElementById('url-input').value = file;
    loadUrl();
}
function loadUrl() {
    const url = document.getElementById('url-input').value.trim();
    if (!url) return;
    document.getElementById('status').style.display = 'none';
    document.getElementById('player-wrap').style.display = 'flex';
    document.getElementById('error').textContent = '';
    video.src = url;
    video.load();
    video.onerror = () => {
        document.getElementById('error').textContent = 'Failed to load: ' + url;
    };
}
function loadFile(e) {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    document.getElementById('status').style.display = 'none';
    document.getElementById('player-wrap').style.display = 'flex';
    document.getElementById('error').textContent = '';
    document.getElementById('url-input').value = f.name;
    video.src = url;
    video.load();
}
</script>
</body>
</html>
